# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-distromas"
BBFILE_PATTERN_meta-distromas := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-distromas = "8"
LAYERSERIES_COMPAT_meta-distromas = "kirkstone langdale mickledore nanbield scarthgap"

