#@TYPE: Machine
#@NAME: OST000x0  
#@SOC: i.MX9352 
#@DESCRIPTION: Machine configuration for uSD image for MAS iMX93 OST000X0 OSM test board
#@MAINTAINER: Dario Scarpa <dario.scarpa@maselettronica.com>


IMX_DEFAULT_BSP             				= "nxp"
MACHINEOVERRIDES            				=. "use-${IMX_DEFAULT_BSP}-bsp:"
MACHINEOVERRIDES            				=. "mx93:"

require include/imx93-mas-nei000x.inc

# BOOTLOADER
UBOOT_SRCBRANCH             				= "imx93-nei000x0-dev-ds"
UBOOT_SRCREV                				= "f36bff189dd4d520bc5a37f1562e1fcb0eb2dec8"
UBOOT_DEVICETREE_BASENAME   				= "imx93-ost000x0"
UBOOT_CONFIG_BASENAME       				= "imx93_ost000x0"
UBOOT_DTB_NAME              				= "${UBOOT_DEVICETREE_BASENAME}.dtb"
UBOOT_CONFIG              					??= "sd"
UBOOT_CONFIG[sd]            				= "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"

# KERNEL
KERNEL_SRCBRANCH            				= "imx93-nei000x0-dev-ds"
KERNEL_SRCREV               				= "c3abac197e00a46e3c3a8cee878b9b776d349ca0"
KERNEL_DEVICETREE_BASENAME  				= "imx93-ost000x0"
KERNEL_DEVICETREE           				= "freescale/${KERNEL_DEVICETREE_BASENAME}.dtb"
KERNEL_DEFCONFIG            				= "imx93_ost000x0_defconfig"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION        				= "202201"
DDR_FIRMWARE_NAME           				= " \
												lpddr4_dmem_1d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_dmem_2d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_imem_1d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_imem_2d_v${DDR_FIRMWARE_VERSION}.bin \
"

# MAS MK-IMAGE
MASMKIMAGE_SRCBRANCH      					= "iMX93-NEI000X0-dev-ds"
MASMKIMAGE_SRCREV         					= "db638f857fb01c52862cd0d287ee29e38f84e609"

# MAS TEST-SUITE
MASTESTSUITE_SRCBRANCH      				= "iMX93-OST000X0-dev-ds"
MASTESTSUITE_SRCREV         				= "021b7b5eb8c124827818f9afa8a598403f45e604"

# PREFERRED PROVIDERS
IMX_DEFAULT_BOOTLOADER:use-nxp-bsp          = "u-boot-mas-imx"
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp     = "u-boot-fslc"
IMX_DEFAULT_ATF_PROVIDER                  	??= "mas-imx-atf"
IMX_DEFAULT_KERNEL:use-nxp-bsp    			= "linux-mas-imx"
IMX_DEFAULT_KERNEL:imx-nxp-bsp     			= "linux-imx"
PREFERRED_PROVIDER_u-boot                 	??= "${IMX_DEFAULT_BOOTLOADER}"
PREFERRED_PROVIDER_virtual/bootloader       = "${IMX_DEFAULT_BOOTLOADER}"
PREFERRED_PROVIDER_virtual/kernel           = "${IMX_DEFAULT_KERNEL}"


# SECO FIRMWARE
SECO_FIRMWARE_NAME							= "mx93a1-ahab-container.img"

# WIC image conf file
SOC_DEFAULT_WKS_FILE        				= "nei000x0-dev-usd.wks.in"


# values: [usd, emmc, prod] select the build type for overwrite the correct fstab file
BUILD_TYPE                  				= "usd"

#if lcd display is used set here the resolution
DISPLAY_RESOLUTION 							= "1024x600"
