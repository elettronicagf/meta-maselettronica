#@TYPE: Machine
#@NAME: JFN0937
#@SOC: i.MX9131 
#@DESCRIPTION: Machine configuration for uSD image for MAS iMX91 JFN0937-CA01+OST000X1
#@MAINTAINER: Dario Scarpa <dario.scarpa@maselettronica.com>


IMX_DEFAULT_BSP             				= "nxp"
MACHINEOVERRIDES            				=. "use-${IMX_DEFAULT_BSP}-bsp:"
MACHINEOVERRIDES            				=. "mx91:"

require include/imx91-mas-jfn0937.inc

# BOOTLOADER
UBOOT_SRCBRANCH             				= "imx91-JFN0937-CA01-dev-ds"
UBOOT_SRCREV                				= "b0ad80fce71f046a560d38c7afb3318e02ef361b"
UBOOT_DEVICETREE_BASENAME   				= "imx91-jfn0937"
UBOOT_CONFIG_BASENAME       				= "imx91_jfn0937"
UBOOT_DTB_NAME              				= "${UBOOT_DEVICETREE_BASENAME}.dtb"
UBOOT_CONFIG              					??= "sd"
UBOOT_CONFIG[sd]            				= "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"

# KERNEL
KERNEL_SRCBRANCH            				= "imx91-jfn0937-dev-ds"
KERNEL_SRCREV               				= "3a0db2acb170afa2ab41f5e8485d534d74ccdf6d"
KERNEL_DEVICETREE_BASENAME  				= "imx91-jfn0937"
KERNEL_DEVICETREE           				= "freescale/${KERNEL_DEVICETREE_BASENAME}.dtb"
KERNEL_DEFCONFIG            				= "imx91_jfn0937_defconfig"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION        				= "202201"
DDR_FIRMWARE_NAME           				= " \
												lpddr4_dmem_1d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_dmem_2d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_imem_1d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_imem_2d_v${DDR_FIRMWARE_VERSION}.bin \
"

# MAS MK-IMAGE
MASMKIMAGE_SRCBRANCH      					= "iMX91-JFN0937-dev-ds"
MASMKIMAGE_SRCREV         					= "efb72d630c67d31faabc713ff8b12b7d2309819f"

# MAS TEST-SUITE
MASTESTSUITE_SRCBRANCH      				= "imx91-jfn0937-dev-ds"
MASTESTSUITE_SRCREV         				= "74d6041a3dab98df9f5689c64c120a89e329bcf8"

# PREFERRED PROVIDERS
IMX_DEFAULT_BOOTLOADER:use-nxp-bsp          = "u-boot-mas-imx"
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp     = "u-boot-fslc"
IMX_DEFAULT_ATF_PROVIDER                  	??= "mas-imx-atf"
IMX_DEFAULT_KERNEL:use-nxp-bsp    			= "linux-mas-imx"
IMX_DEFAULT_KERNEL:imx-nxp-bsp     			= "linux-imx"
PREFERRED_PROVIDER_u-boot                 	??= "${IMX_DEFAULT_BOOTLOADER}"
PREFERRED_PROVIDER_virtual/bootloader       = "${IMX_DEFAULT_BOOTLOADER}"
PREFERRED_PROVIDER_virtual/kernel           = "${IMX_DEFAULT_KERNEL}"


# SECO FIRMWARE
SECO_FIRMWARE_NAME							= "mx91a0-ahab-container.img"

# WIC image conf file
SOC_DEFAULT_WKS_FILE        				= "mas-default-dev-usd.wks.in"


# values: [usd, emmc, prod] select the build type for overwrite the correct fstab file
BUILD_TYPE                  				= "usd"

#if lcd display is used set here the resolution
DISPLAY_RESOLUTION 							= "1024x600"
