#@TYPE: Machine
#@NAME: JFN0937-AA06AA1 
#@SOC: i.MX9352 
#@DESCRIPTION:	Machine configuration for uSD image for OSM JFN0937-AA06AA1 board on OST000X1 carrier board
#				RAM: 2GB LPDDR4X Alliance Memory AS4C1G16MD4V-046BIN
#					 2GB LPDDR4X Alliance Memory AS4C1G16MD4VA-046BIN
#@MAINTAINER: Dario Scarpa <dario.scarpa@maselettronica.com>


IMX_DEFAULT_BSP             				= "nxp"
MACHINEOVERRIDES            				=. "use-${IMX_DEFAULT_BSP}-bsp:"
MACHINEOVERRIDES            				=. "mx93:"
MACHINEOVERRIDES            				=. "ailux:"

require include/imx93-mas-nei000x.inc

# BOOTLOADER
UBOOT_SRCBRANCH             				= "imx93-jfn0937-aa06aa0"
UBOOT_SRCREV                				= "d23c68a04f646a53b492fd862515a4ec0a9f610d"
UBOOT_DEVICETREE_BASENAME   				= "imx93-ost000x1"
UBOOT_CONFIG_BASENAME       				= "imx93_ost000x1"
UBOOT_DTB_NAME              				= "${UBOOT_DEVICETREE_BASENAME}.dtb"
UBOOT_CONFIG              					??= "emmc"
UBOOT_CONFIG[emmc]            				= "${UBOOT_CONFIG_BASENAME}_v2_emmc_defconfig,sdcard"

# KERNEL
KERNEL_SRCBRANCH            				= "imx93-ost000x1-dev-ds"
KERNEL_SRCREV               				= "9ccac4cce2d0b9de5f0892560e8cd7af6ec12db8"
KERNEL_DEVICETREE_BASENAME  				= "imx93-ost000x1"
KERNEL_DEVICETREE           				= "freescale/${KERNEL_DEVICETREE_BASENAME}.dtb"
KERNEL_DEFCONFIG            				= "imx93_ost000x1_v2_defconfig"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION        				= "202201"
DDR_FIRMWARE_NAME           				= " \
												lpddr4_dmem_1d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_dmem_2d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_imem_1d_v${DDR_FIRMWARE_VERSION}.bin \
												lpddr4_imem_2d_v${DDR_FIRMWARE_VERSION}.bin \
"

# MAS MK-IMAGE
MASMKIMAGE_SRCBRANCH      					= "iMX93-OST000X1-dev-ds"
MASMKIMAGE_SRCREV         					= "b0d6a5fa2c5d72727d89c410ffcce5592e977e5d"

# MAS TEST-SUITE
MASTESTSUITE_SRCBRANCH      				= "iMX93-OST000X1-dev-ds"
MASTESTSUITE_SRCREV         				= "fd79a748dc6edfe9e27fea3dc3243654833568b9"

# PREFERRED PROVIDERS
IMX_DEFAULT_BOOTLOADER:use-nxp-bsp          = "u-boot-mas-imx"
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp     = "u-boot-fslc"
IMX_DEFAULT_ATF_PROVIDER                  	??= "mas-imx-atf"
IMX_DEFAULT_KERNEL:use-nxp-bsp    			= "linux-mas-imx"
IMX_DEFAULT_KERNEL:imx-nxp-bsp     			= "linux-imx"
PREFERRED_PROVIDER_u-boot                 	??= "${IMX_DEFAULT_BOOTLOADER}"
PREFERRED_PROVIDER_virtual/bootloader       = "${IMX_DEFAULT_BOOTLOADER}"
PREFERRED_PROVIDER_virtual/kernel           = "${IMX_DEFAULT_KERNEL}"


# SECO FIRMWARE
SECO_FIRMWARE_NAME							= "mx93a1-ahab-container.img"

# WIC image conf file
SOC_DEFAULT_WKS_FILE        				= "ost000x-dev-usd.wks.in"


# values: [usd, emmc, prod] select the build type for overwrite the correct fstab file
BUILD_TYPE                  				= "emmc"

#if lcd display is used set here the resolution
DISPLAY_RESOLUTION 							= "1024x600"
