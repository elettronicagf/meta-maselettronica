# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "maselettronica-layer"
BBFILE_PATTERN_maselettronica-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_maselettronica-layer = "6"
LAYERSERIES_COMPAT_maselettronica-layer = "kirkstone langdale mickledore nanbield scarthgap"
LAYERDEPENDS_maselettronica-layer = "core"

MAS_DEFAULT_UBOOTTOOLS = "u-boot-mas-tools"
PREFERRED_PROVIDER_u-boot-tools-native = "${MAS_DEFAULT_UBOOTTOOLS}-native"
PREFERRED_PROVIDER_nativesdk-u-boot-tools = "nativesdk-${MAS_DEFAULT_UBOOTTOOLS}"
PREFERRED_PROVIDER_u-boot-mkimage-native = "${MAS_DEFAULT_UBOOTTOOLS}-native"
PREFERRED_PROVIDER_nativesdk-u-boot-mkimage = "nativesdk-${MAS_DEFAULT_UBOOTTOOLS}"
