[core]
# i.MX: Disable idle timeout
idle-time=0
xwayland=true
# use-g2d=1

[shell]
size=800x480
panel-position=top
background-color=0xFF000000
background-image=/usr/share/icons/maselettronica/background-maselettronica.png


[libinput]
touchscreen_calibrator=true

[launcher]
icon=/usr/share/icons/maselettronica/killall.png
path=/root/test-mas/killall_graphics

[launcher]
icon=/usr/share/icons/maselettronica/touch.png
path=/usr/bin/weston-simple-touch

[launcher]
icon=/usr/share/icons/maselettronica/editor.png
path=/usr/bin/weston-editor

# [launcher]
# icon=/usr/share/icons/maselettronica/chromium-logo.png
# path=/usr/bin/chromium --no-sandbox --start-maximized

# [launcher]
# icon=/usr/share/icons/maselettronica/camera.png
# path=/root/test-mas/test_uvc

# [launcher]
# icon=/usr/share/icons/maselettronica/wifi.svg.png
# path=/root/test-mas/launch_wifi_client

#[launcher]
#icon=/usr/share/icons/maselettronica/qt-logo.png
#path=/root/test-mas/launch_qt_app

[launcher]
icon=/usr/share/icons/maselettronica/terminal.png
path=/root/test-mas/launch_terminal

[launcher]
icon=/usr/share/icons/maselettronica/video.png
path=/root/test-mas/demo-video

[launcher]
icon=/usr/share/icons/maselettronica/camera.png
path=/root/test-mas/demo-camera

[launcher]
icon=/usr/share/icons/maselettronica/chromium.png
path=/root/test-mas/launch_chromium

[launcher]
icon=/usr/share/icons/maselettronica/wifi.png
path=/root/test-mas/set-wifi

[launcher]
icon=/usr/share/icons/maselettronica/triangles.png
path=/usr/bin/weston-simple-egl

[launcher]
icon=/usr/share/icons/maselettronica/smoke.png
path=/usr/bin/weston-smoke

[input-method]
path=/usr/libexec/weston-keyboard

#[output]
#name=HDMI-A-1
#mode=1920x1080@60
#transform=90


#[output]
#name=HDMI-A-2
#mode=off
#	WIDTHxHEIGHT    Resolution size width and height in pixels
#	off             Disables the output
#	preferred       Uses the preferred mode
#	current         Uses the current crt controller mode
#transform=90

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize
